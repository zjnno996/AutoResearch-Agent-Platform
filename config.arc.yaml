research_engine:
  enabled: true
  workflow: compact
  phase_max_iterations: 16
  max_model_calls: 0
  artifact_reasoning_effort: high
  public_source_search: true
  public_source_cache_dir: ~/.cache/emnets-ra/public_sources
  max_source_queries: 2
  max_public_sources: 2
  source_context_chars: 512000
  formal_source_context_chars: 768000
  profile: quality_first
  study_type: auto
  target_quality_score: 9.0
  max_repair_rounds: 8
  council_enabled: true
  rubric_enabled: true
  skills_enabled: true
  max_skills_per_stage: 3
  skill_context_chars: 24000
  memory_context_chars: 8000
  evidence_context_chars: 48000
  shared_memory: true
  skills_dirs: []
  efficiency_approval: ''
  method_analysis_first: true
project:
  name: emnets-ra
  mode: full-auto
research:
  topic: local test topic
  domains:
  - deep-learning
  daily_paper_count: 5
  idea_count: 5
  quality_threshold: 3.0
  reference_papers: []
notifications:
  channel: console
  on_stage_start: true
  on_gate_required: true
knowledge_base:
  backend: markdown
  root: docs/kb
openclaw_bridge:
  use_message: false
  use_memory: false
  use_web_fetch: false
review_llm:
  provider: openai-compatible
  base_url: ''
  api_key: ''
  api_key_env: RESEARCHCLAW_API_KEY
  primary_model: Qwen3.8-27B-FP8
  fallback_models: []
  timeout_sec: 600
  max_retries: 2
  strip_thinking: true
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
      reasoning_effort: xhigh
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
  max_tokens: 262144
  reasoning_token_reserve: 0
  temperature: 1.0
